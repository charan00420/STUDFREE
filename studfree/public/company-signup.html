<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Signup - StudFree</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:30px;
width:400px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
border-radius:6px;
}

button:hover{
background:#1d4ed8;
}
</style>
</head>

<body>

<div class="box">

<h2>Company Registration</h2>

<form id="companyForm">

<input id="companyName" placeholder="Company Name" required>

<input id="email" type="email" placeholder="Company Email" required>

<input id="password" type="password" placeholder="Password" required>

<input id="website" placeholder="Website">

<textarea id="description" placeholder="Company Description"></textarea>

<button type="submit">Register Company</button>

</form>

</div>

<script>

document.getElementById("companyForm").addEventListener("submit", async function(e){

e.preventDefault();

const payload = {
companyName: document.getElementById("companyName").value,
email: document.getElementById("email").value,
password: document.getElementById("password").value,
website: document.getElementById("website").value,
description: document.getElementById("description").value
};

const res = await fetch("/api/company/signup",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
});

const data = await res.json();

if(res.ok){
alert("Company registered successfully!");
window.location="/company-login.html";
}else{
alert(data.error);
}

});

</script>

</body>
</html>
