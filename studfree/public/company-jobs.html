<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Jobs</title>
</head>

<body>

<h1>My Jobs</h1>

<table border="1">

<thead>
<tr>
<th>Title</th>
<th>Company</th>
<th>Budget</th>
</tr>
</thead>

<tbody id="jobsTable">

</tbody>

</table>

<script>

async function loadJobs(){

const company = JSON.parse(localStorage.getItem("company"));

const res = await fetch("/api/jobs");

const data = await res.json();

const table = document.getElementById("jobsTable");

table.innerHTML = "";

data.jobs
.filter(job => job.companyEmail === company.email)
.forEach(job => {

table.innerHTML += `
<tr>
<td>${job.title}</td>
<td>${job.company}</td>
<td>${job.budget}</td>
<td>
<button onclick="viewApplicants('${job.id}')">
View Applicants (${job.applicants.length})
</button>
</td>
</tr>
`;

});

}

loadJobs();
function viewApplicants(jobId){

const company = JSON.parse(localStorage.getItem("company"));

fetch("/api/jobs")
.then(res => res.json())
.then(data => {

const job = data.jobs.find(j => j.id === jobId);

if(!job){
alert("Job not found");
return;
}

if(job.companyEmail !== company.email){
alert("Unauthorized");
return;
}

if(job.applicants.length === 0){
alert("No applicants yet.");
return;
}

let text = "";

job.applicants.forEach((a,index)=>{

text += `${index + 1}. ${a.studentName}\n`;
text += `Message: ${a.message}\n`;
text += `Status: ${a.status}\n`;

if (a.status === "pending") {
    text += `Hire URL: /api/jobs/${job.id}/hire/${a.studentId}\n`;
}

text += "\n";
});

alert(text);

});

}
async function hireStudent(jobId, studentId){

const res = await fetch(`/api/jobs/${jobId}/hire/${studentId}`,{
method:"POST"
});

const data = await res.json();

if(res.ok){
alert("Student hired successfully!");
loadJobs();
}else{
alert(data.error);
}

}
</script>

</body>
</html>
