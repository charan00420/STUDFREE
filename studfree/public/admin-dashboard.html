<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudFree Admin Dashboard</title>

<link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="sidebar">
    <h2>👑 StudFree</h2>

    <a href="#">📊 Dashboard</a>
    <a href="#">👥 Students</a>
    <a href="/jobs-admin.html">💼 Jobs</a>
    <a href="#">📈 Analytics</a>
    <a href="#">⚙️ Settings</a>
    <a href="#">🚪 Logout</a>
</div>

<div class="main">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Students</h3>
<p id="studentsCount">0</p>
</div>

<div class="card">
<h3>Total Jobs</h3>
<p id="jobsCount">0</p>
</div>

<div class="card">
<h3>Students Hired</h3>
<p id="hiredCount">0</p>
</div>

</div>

<h2>Registered Students</h2>

<table>

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>Action</th>
</tr>

</thead>

<tbody id="studentsTable">

</tbody>

</table>

</div>

<script>

async function loadStats(){

const res=await fetch("/api/stats");

const data=await res.json();

document.getElementById("studentsCount").innerText=data.students;
document.getElementById("jobsCount").innerText=data.jobs;
document.getElementById("hiredCount").innerText=data.hired;

}

async function loadStudents(){

const res=await fetch("/api/students");

const data=await res.json();

const table=document.getElementById("studentsTable");

table.innerHTML="";

data.students.forEach(student=>{

table.innerHTML+=`
<tr>
<td>${student.name}</td>
<td>${student.email}</td>
<td>
<button onclick="deleteStudent('${student.id}')">
Delete
</button>
</td>
</tr>
`;

});

}

async function deleteStudent(id){

if(!confirm("Delete this student?")) return;

const res=await fetch("/api/students/"+id,{
method:"DELETE"
});

if(res.ok){

loadStudents();

loadStats();

}

}

loadStats();

loadStudents();

</script>

</body>
</html>
