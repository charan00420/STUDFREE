<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — STUDFREE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a href="/" class="wordmark">STUDFREE<span class="dot">.</span><small>CAMPUS FREELANCE LEDGER</small></a>
    <nav class="primary">
      <a href="/browse.html">Browse students</a>
      <a href="/jobs.html">Job board</a>
      <a href="/signup.html" data-auth="guest">Sign up</a>
      <a href="/dashboard.html" data-auth="member">Dashboard</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="auth-card">
    <span class="kicker">Welcome back</span>
    <h2 class="mt-0">Log in</h2>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password">
      </div>
      <button type="submit" class="btn brass block">Log in</button>
    </form>
    <p class="switch-line">New here? <a href="/signup.html">Create a listing</a></p>
  </div>
</div>

<footer>
  <div class="wrap">
    <p>STUDFREE — a campus freelance ledger. Built as a student project.</p>
    <p>© 2026 STUDFREE</p>
  </div>
</footer>

<script src="/js/app.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    };
    const btn = e.target.querySelector("button");
    btn.disabled = true; btn.textContent = "Logging in…";
    try {
      const { student } = await api("/login", { method: "POST", body: JSON.stringify(payload) });
      Session.set(student);
      toast("Welcome back, " + student.name.split(" ")[0]);
      setTimeout(() => (window.location.href = "/dashboard.html"), 400);
    } catch (err) {
      toast(err.message);
      btn.disabled = false; btn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
